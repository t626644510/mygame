name: Helper editor checks

on:
  push:
    branches: [main]
    paths:
      - 'tools/sim-cli/**'
      - 'tools/editor-web/**'
      - 'tools/editor-verification/**'
      - 'content/**'
      - 'docs/editor/**'
      - 'Game/Assets/Prototype/Combat/**'
      - 'Game/Assets/Prototype/BaseEconomy/Runtime/**'
      - 'Game/Assets/Prototype/Tactics/Runtime/**'
      - 'Game/Assets/Prototype/Expedition/Runtime/**'
      - '.github/workflows/sim-cli-p0.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/sim-cli/**'
      - 'tools/editor-web/**'
      - 'tools/editor-verification/**'
      - 'content/**'
      - 'docs/editor/**'
      - 'Game/Assets/Prototype/Combat/**'
      - 'Game/Assets/Prototype/BaseEconomy/Runtime/**'
      - 'Game/Assets/Prototype/Tactics/Runtime/**'
      - 'Game/Assets/Prototype/Expedition/Runtime/**'
      - '.github/workflows/sim-cli-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      P0_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: tools/sim-cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - name: Build formal projects and verify actual CLI outputs
        run: ./verification/Invoke-P0Checks.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sim-cli-p0')
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Verify P1 backend and frontend build
        run: |
          $repository = Split-Path -Parent (Split-Path -Parent $PWD.Path)
          node verification/Invoke-P1Checks.mjs --output (Join-Path $repository 'outputs/p1-ci') --work (Join-Path $repository 'work/p1-ci') --dotnet (Get-Command dotnet).Source --cli (Join-Path $PWD.Path 'src/MyGame.Sim.Cli/bin/Release/net8.0/sim-cli.dll') --pwsh (Get-Process -Id $PID).Path
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify P2 source round trips and atomic import conflicts
        run: |
          $repository = Split-Path -Parent (Split-Path -Parent $PWD.Path)
          node verification/Invoke-P2Checks.mjs --output (Join-Path $repository 'outputs/helper_editor_p2/verification/ci') --work (Join-Path $repository 'work/p2_verification_20261116/ci') --dotnet (Get-Command dotnet).Source --cli (Join-Path $PWD.Path 'src/MyGame.Sim.Cli/bin/Release/net8.0/sim-cli.dll') --formal-evidence (Join-Path $env:RUNNER_TEMP 'sim-cli-p0')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve build logs and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-cli-p0-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-cli-p0
          if-no-files-found: error
          retention-days: 30
      - name: Preserve P1 raw commands and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helper-editor-p1-${{ matrix.os }}-${{ github.run_attempt }}
          path: outputs/p1-ci
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve P2 raw kernel comparisons and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helper-editor-p2-${{ matrix.os }}-${{ github.run_attempt }}
          path: outputs/helper_editor_p2/verification/ci
          if-no-files-found: warn
          retention-days: 30
